<style>
  #ising-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: auto;
    cursor: crosshair;
    opacity: 0.85;
  }
</style>

<script>
(function() {
  function initIsingHero() {
    var titleContainer = document.querySelector('.quarto-title-block') || document.querySelector('header.quarto-title-block');
    if (!titleContainer) return;

    if (document.getElementById('ising-canvas')) return;

    titleContainer.style.position = 'relative';
    titleContainer.style.overflow = 'hidden';

    var canvas = document.createElement('canvas');
    canvas.id = 'ising-canvas';
    canvas.title = 'Move your cursor to perturb the lattice';
    titleContainer.insertBefore(canvas, titleContainer.firstChild);

    var ctx = canvas.getContext('2d');
    var cell = 20;
    var cols = 8, rows = 8;
    var spins = new Int8Array(0);
    var fieldW = 0, fieldH = 0;
    var forcedFlash = new Set();
    var rafId = null;

    function resize() {
      var rect = titleContainer.getBoundingClientRect();
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = rect.width * dpr;
      canvas.height = Math.max(rect.height, 220) * dpr;
      canvas.style.width = rect.width + 'px';
      canvas.style.height = Math.max(rect.height, 220) + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      fieldW = rect.width;
      fieldH = Math.max(rect.height, 220);

      var newCols = Math.max(8, Math.floor(fieldW / cell));
      var newRows = Math.max(8, Math.floor(fieldH / cell));

      if (cols !== newCols || rows !== newRows) {
        cols = newCols;
        rows = newRows;
        spins = new Int8Array(cols * rows);
        for (var k = 0; k < spins.length; k++) {
          spins[k] = Math.random() < 0.5 ? 1 : -1;
        }
      }
    }

    resize();
    var ro = new ResizeObserver(resize);
    ro.observe(titleContainer);

    var T = 2.3; // Near 2D Ising critical temperature (J=1)
    function idx(x, y) {
      return (((y % rows) + rows) % rows) * cols + (((x % cols) + cols) % cols);
    }

    function perturb(e) {
      if (!spins || spins.length === 0) return;
      var rect = canvas.getBoundingClientRect();
      var gx = Math.floor((e.clientX - rect.left) / cell);
      var gy = Math.floor((e.clientY - rect.top) / cell);
      var radius = 4;
      for (var dy = -radius; dy <= radius; dy++) {
        for (var dx = -radius; dx <= radius; dx++) {
          if (dx * dx + dy * dy > radius * radius) continue;
          var x = ((gx + dx) % cols + cols) % cols;
          var y = ((gy + dy) % rows + rows) % rows;
          var i = y * cols + x;
          spins[i] = -spins[i];
          forcedFlash.add(i);
        }
      }
    }

    canvas.addEventListener('mousemove', perturb);

    function step() {
      var sweeps = Math.round(cols * rows * 0.03);
      var flipped = new Set();
      for (var n = 0; n < sweeps; n++) {
        var x = (Math.random() * cols) | 0;
        var y = (Math.random() * rows) | 0;
        var i = idx(x, y);
        var s = spins[i];
        var nb = spins[idx(x + 1, y)] + spins[idx(x - 1, y)] + spins[idx(x, y + 1)] + spins[idx(x, y - 1)];
        var dE = 2 * s * nb;
        if (dE <= 0 || Math.random() < Math.exp(-dE / T)) {
          spins[i] = -s;
          flipped.add(i);
        }
      }
      return flipped;
    }

    function draw() {
      var flipped = step();
      forcedFlash.forEach(function(i) { flipped.add(i); });
      forcedFlash.clear();

      ctx.clearRect(0, 0, fieldW, fieldH);

      var isDark = document.documentElement.classList.contains('dark') ||
                     document.body.classList.contains('quarto-dark');

      var inkColor = isDark ? '#eae7e7' : '#201e1d';
      var accent = isDark ? '#ff563c' : '#ec3013';

      for (var y = 0; y < rows; y++) {
        for (var x = 0; x < cols; x++) {
          var i = y * cols + x;
          var up = spins[i] > 0;
          if (flipped.has(i)) {
            ctx.fillStyle = isDark ? 'rgba(255, 86, 60, 0.55)' : 'rgba(236, 48, 19, 0.55)';
          } else if (up) {
            ctx.fillStyle = isDark ? 'rgba(234, 231, 231, 0.30)' : 'rgba(32, 30, 29, 0.30)';
          } else {
            ctx.fillStyle = isDark ? 'rgba(234, 231, 231, 0.06)' : 'rgba(32, 30, 29, 0.06)';
          }
          ctx.fillRect(x * cell + 1, y * cell + 1, cell - 2, cell - 2);
        }
      }
      rafId = requestAnimationFrame(draw);
    }

    draw();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initIsingHero);
  } else {
    initIsingHero();
  }
})();
</script>
